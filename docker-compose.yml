services:
  talentiq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EMBEDDINGS: "true"
    container_name: talentiq-app
    ports:
      - "${TALENTIQ_PORT:-8501}:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - TALENTIQ_DATA_DIR=/app/data
      - TALENTIQ_DISABLE_SAVED_SMTP=${TALENTIQ_DISABLE_SAVED_SMTP:-0}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    env_file:
      - .env
    volumes:
      - ./:/app
      - talentiq-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  talentiq-data:
    name: talentiq-data
